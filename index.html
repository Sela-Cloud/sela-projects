<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELA Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --accent: #2563eb;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        header {
            margin-bottom: 48px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
        }

        .search {
            width: 100%;
            margin: 40px 0;
        }

        .search input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .search input:focus {
            border-color: var(--accent);
        }

        .projects {
            display: grid;
            gap: 16px;
        }

        .project {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: .2s ease;
        }

        .project:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .project h3 {
            margin-bottom: 6px;
            font-size: 18px;
        }

        .project p {
            color: var(--muted);
            font-size: 14px;
        }

        footer {
            margin-top: 60px;
            color: var(--muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .hidden {
            display: none;
        }

        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>SELA Projects</h1>
        <p class="subtitle">
            Internal engineering projects and tools.
        </p>
    </header>

    <div class="search">
        <input
            id="search"
            type="text"
            placeholder="Search projects..."
        >
    </div>

    <section class="projects" id="projects">

        <div class="project"
             data-name="Neyyar"
             onclick="openProject('Neyyar')">

            <h3>Neyyar</h3>
            <p>Internal engineering platform.</p>

        </div>

        <!--
        Duplicate projects like this:

        <div class="project"
             data-name="MyProject"
             onclick="openProject('MyProject')">

            <h3>MyProject</h3>
            <p>Description...</p>

        </div>
        -->

    </section>

    <footer>
        SELA Engineering • GitHub Pages
    </footer>

</div>

<script>

//
// Automatically detects the GitHub repository name.
//
// Example:
//
// https://user.github.io/sela-projects/
//               ^^^^^^^^^^^^^
//
// BASE becomes "/sela-projects"
//
const parts = window.location.pathname.split("/");
const BASE = parts.length > 1 ? "/" + parts[1] : "";

function openProject(project) {
    window.location.href = `${BASE}/projects/${project}/`;
}

document
.getElementById("search")
.addEventListener("input", function () {

    const value = this.value.toLowerCase();

    document
    .querySelectorAll(".project")
    .forEach(project => {

        const visible =
            project.dataset.name
                .toLowerCase()
                .includes(value);

        project.classList.toggle("hidden", !visible);

    });

});

// IMPORTANT:
// GitHub Pages does NOT support rewriting
// "/Neyyar" -> "/projects/Neyyar"
//
// Therefore, NO automatic redirect is performed here.
// Navigation should happen through the project cards.

</script>

</body>
</html>
