<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Execute as soon as the script loads
        (function() {
            // Get the 'path' parameter from the URL string
            const urlParams = new URLSearchParams(window.location.search);
            const targetPath = urlParams.get('path');

            if (targetPath) {
                // Ensure the path doesn't start with a slash if you want it to be relative 
                // to the current repository directory
                const cleanPath = targetPath.startsWith('/') ? targetPath.substring(1) : targetPath;
                
                // Redirect without keeping this root page in the browser's back history
                window.location.replace(cleanPath);
            }
        })();
    </script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding-top: 20vh; 
            color: #333; 
            background-color: #f9f9f9;
        }
        .message { margin-top: 15px; color: #666; }
    </style>
</head>
<body>
    <h2>Routing to destination...</h2>
    <p class="message">If you are not redirected automatically, check the URL provided.</p>
</body>
</html>
